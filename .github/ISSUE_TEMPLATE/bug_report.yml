name: Bug Report
description: File a bug report
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal code example that demonstrates the issue
      placeholder: |
        ```typescript
        import { repair } from 'structured-output-repair';
        import { z } from 'zod';

        const schema = z.object({ name: z.string() });
        const result = await repair(schema, '...');
        ```
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of structured-output-repair are you running?
      placeholder: e.g., 1.0.0
    validations:
      required: true
  - type: dropdown
    id: node-version
    attributes:
      label: Node.js version
      options:
        - '20.x'
        - '22.x'
        - 'Other'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell
