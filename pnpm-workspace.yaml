packages:
  - 'packages/*'

# Security/compatibility overrides for transitive dependencies.
# Lives here (not in package.json's `pnpm` field) because pnpm >=10.x no
# longer reads settings from package.json.
overrides:
  esbuild: '>=0.25.0'
  vite: '>=6.4.2'
  fast-uri: '>=3.1.2'
  hono: '>=4.12.18'
  ip-address: '>=10.1.1'
  'brace-expansion@>=5.0.0': '>=5.0.6'
  qs: '>=6.15.2'
